meta:
  name: "현대통신 엘리베이터"
  name_en: "Hyundai Telecom Elevator"
  description: "현대통신 월패드용 엘리베이터 호출 및 상태 확인 설정입니다. 참고: https://github.com/wooooooooooook/homenet2mqtt/blob/main/gallery/hyundai_imazu/elevator.yaml"
  description_en: "Elevator call and status configuration for Hyundai Telecom wallpads. Reference: https://github.com/wooooooooooook/homenet2mqtt/blob/main/gallery/hyundai_imazu/elevator.yaml"
  version: "1.0.0"
  author: "broadeep"
  tags: ["elevator", "hyundai", "imazu"]

uart:
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1
  rx_pin: GPIO22
  tx_pin: GPIO19

external_components:
  - source: github://broadeep72-cloud/HA-esp@latest
    components: [ uartex ]
    refresh: always  

uartex:
  rx_timeout: 10ms
  tx_delay: 50ms
  tx_timeout: 500ms
  tx_retry_cnt: 3

  rx_header: [0xf7]
  rx_footer: [0xee]
  tx_header: [0xf7]
  tx_footer: [0xee]

  rx_checksum: xor
  tx_checksum: xor

  version:
    disabled: False
  error:
    disabled: False
  log:
    disabled: False

discovery:
  match:
    data: [0x0D, 0x01, 0x34, 0x01, 0x41]
    mask: [0x00, 0xff, 0xff, 0xff, 0xff]

scripts:
  - id: 'elevator_call_down_script'
    actions:
      - action: send_packet
        data: [0x0B, 0x01, 0x34, 0x04, 0x41, 0x10, 0x00, 0x06]
        # 안되면 아래 패킷으로 시도해보세요.
        # data: [0x0B, 0x01, 0x34, 0x02, 0x41, 0x10, 0x06, 0x00]
        checksum: true
        header: true
        footer: true

entities:
  text_sensor:
    - id: 'elevator_floor'
      name: 'Elevator Floor'
      icon: 'mdi:elevator'
      state:
        # Match Query Packet: F7 0D 01 34 01 41 10 00 [State] [Floor] [ID] [CS] EE
        # Header(F7) is omitted in standard parsing usually, but index calculations assume F7 is x[0]
        data: [0x0D, 0x01, 0x34, 0x01, 0x41]
      state_text: >
        data[9] >= 0xB0 ? 'B' + string(data[9] - 0xB0) : string(bcd_to_int(data[9]))

    - id: 'elevator_state'
      name: 'Elevator State'
      icon: 'mdi:elevator-passenger'
      state:
        data: [0x0D, 0x01, 0x34, 0x01, 0x41]
      state_text: >
        bitShiftRight(data[8], 4) == 0xA ? 'Up' : (bitShiftRight(data[8], 4) == 0xB ? 'Down' : 'Idle')

  button:
    - id: 'elevator_call_down'
      name: 'Call Elevator Down'
      icon: 'mdi:elevator-down'
      command_press:
        script: elevator_call_down_script
      discovery_linked_id: 'elevator_floor'

    - id: 'elevator_call_up'
      name: 'Call Elevator Up'
      icon: 'mdi:elevator-up'
      command_press:
        script: elevator_call_up_script
      discovery_linked_id: 'elevator_floor'        
